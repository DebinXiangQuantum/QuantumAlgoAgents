name: Bug report
description: Report reproducible incorrect behavior in the plugin or deterministic tools.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: >-
        Do not include secrets, private research data, security vulnerabilities,
        or confidential conduct reports. Use SECURITY.md for vulnerabilities.
  - type: dropdown
    id: version
    attributes:
      label: Version
      options:
        - "0.1.1"
        - "main / unreleased"
        - "other"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS or sandbox, and relevant dependency versions.
      placeholder: "Python 3.12, Ubuntu 24.04, jsonschema 4.x"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Codex skill workflow
        - CLI
        - MCP
        - QADL or search-space schema
        - Random or evolutionary search
        - PPO or MaskablePPO
        - Documentation or packaging
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the smallest sanitized input and exact command or MCP request.
      render: shell
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or evidence
      description: Paste sanitized output or link to a minimal public artifact.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed secrets and private data.
          required: true
        - label: This is not a security vulnerability or private conduct report.
          required: true
        - label: I searched existing issues for the same behavior.
          required: true
