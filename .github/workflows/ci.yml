name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: scripts/requirements-core.txt
      - name: Install core dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-core.txt
      - name: Run core tests
        run: python -m unittest discover -s tests -v

  optional-search:
    name: Optional search smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scripts/requirements-core.txt
            scripts/requirements-search.txt
      - name: Install core and search dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-core.txt -r scripts/requirements-search.txt
      - name: Run MaskablePPO smoke test
        run: >-
          python scripts/train_sb3.py
          assets/examples/grover-resource-tradeoff.search.json
          --algorithm maskable-ppo
          --steps 64
          --seed 11
          --model-out "${RUNNER_TEMP}/qadl-ppo-smoke"
          --candidate-out "${RUNNER_TEMP}/qadl-ppo-smoke.json"
